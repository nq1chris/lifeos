<html lang="de">
<head>

<style>
:root{--bg:#090B10;--card:#151A25;--card2:#1C2331;--blue:#00D4FF;--text:#F3F5F9;--mute:#8A93A6;--ok:#34D399;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;min-height:100vh}
#app{padding:20px 18px 130px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.sub{color:var(--mute);font-size:13px;margin-bottom:4px}
h1{font-size:25px;margin:0;font-weight:700;letter-spacing:-.3px;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--card2) center/cover;border:2px solid var(--blue);display:grid;place-items:center;font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:22px;padding:16px;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--card2)}
.ring .fg{stroke:var(--blue);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big{font-size:26px;font-weight:700}
.lbl{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card .v{font-size:22px;font-weight:700;margin-top:6px}
.card .v small{font-size:13px;color:var(--mute);font-weight:500}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.ico{font-size:18px}
.add{margin-top:10px;border:0;background:var(--blue);color:#fff;border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600}
.add:active{transform:scale(.94)}
h2{font-size:17px;margin:22px 0 10px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--card2)}
.ev:first-of-type{border-top:0}
.ev b{color:var(--blue);min-width:52px;font-size:14px}
.ev span{font-size:12px;color:var(--mute);display:block}
#fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:34px;box-shadow:0 8px 28px rgba(37,99,235,.55);z-index:30;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#fab.open{transform:rotate(135deg)}
#veil{position:fixed;inset:0;background:rgba(9,11,16,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#veil.open{opacity:1;pointer-events:auto}
#menu{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:25;pointer-events:none}
#menu.open{pointer-events:auto}
.mi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card2);color:var(--text);border-radius:18px;padding:12px 16px;font-size:15px;font-weight:600;opacity:0;transform:translateY(24px) scale(.9);transition:all .4s cubic-bezier(.3,1.4,.5,1)}
#menu.open .mi{opacity:1;transform:none}
.mi:active{background:var(--blue)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.3,1);z-index:40}
#sheet.open{transform:none}
#sheet{max-height:88vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--card2)}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px}
.row .btn{margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;border:0;border-radius:12px;padding:10px 0;background:var(--card2);color:var(--mute);font-weight:600;font-size:14px}
.tab.on{background:var(--blue);color:#fff}
.sm{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}
.sm b{display:block;font-size:17px;margin:2px 0}
select,textarea{width:100%;background:var(--bg);border:1px solid var(--card2);color:var(--text);border-radius:14px;padding:14px;font-size:16px;margin-bottom:12px;font-family:inherit}
input[type=date],input[type=time]{min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cd{aspect-ratio:1;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;border:0;color:var(--text);padding:0}
.cd.td{outline:2px solid var(--blue)}
.dots{display:flex;gap:2px;height:5px;margin-top:3px}
.dots i{width:5px;height:5px;border-radius:50%}
.ce{display:flex;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card2);margin-bottom:8px;align-items:center}
.ce>i{width:4px;align-self:stretch;border-radius:4px;flex:none}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 12px}
.nav button{background:var(--card2);border:0;color:var(--text);border-radius:12px;padding:8px 14px;font-size:15px}
.card[data-go]{cursor:pointer}
.card[data-go]:active{filter:brightness(1.3)}
.bars{display:flex;gap:4px;height:100px;margin-top:10px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end}
.bt{width:100%;background:var(--blue);border-radius:6px 6px 3px 3px;transition:height .6s}
.bc .lbl{font-size:10px;height:12px}
:root{--bad:#F87171}
body{background:radial-gradient(120% 45% at 50% -8%,#13265c 0%,rgba(9,11,16,0) 70%),#090B10;background-attachment:fixed;font-variant-numeric:tabular-nums}
.card{border:1px solid rgba(255,255,255,.06)}
.card.hero{background:linear-gradient(135deg,#1E3A8A 0%,#151A25 65%);border-color:rgba(37,99,235,.35)}
.ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:rgba(37,99,235,.16);font-size:16px}
.btn{transition:transform .15s}.btn:active{transform:scale(.98)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.25)}
#sheet{border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.mi{box-shadow:0 6px 20px rgba(0,0,0,.35)}
#cls{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;z-index:50;place-items:center}
.th{width:64px;height:64px;object-fit:cover;border-radius:10px}
.thr{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.thw{position:relative}
.thx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#F87171;color:#fff;font-size:12px;padding:0}
#sheet h3{margin:0 0 8px;font-size:20px}
#sheet p{color:var(--mute);margin:0 0 16px;line-height:1.5}
input{width:100%;background:var(--bg);border:1px solid var(--card2);color:var(--text);border-radius:14px;padding:14px;font-size:16px;margin-bottom:12px}
.btn{width:100%;border:0;background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:600}

/* ===== J.A.R.V.I.S. HUD ===== */
:root{--bg:#02060C;--card:#07121C;--card2:#0C1D2B;--blue:#00D4FF;--text:#E6FAFF;--mute:#6C93A6;--ok:#2DFFB0;--bad:#FF4D5E}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pl{50%{opacity:.3}}
@keyframes fp{50%{box-shadow:0 0 0 7px rgba(0,212,255,.1),0 0 44px rgba(0,212,255,1)}}
body{font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:17px;background:radial-gradient(90% 40% at 50% -5%,rgba(0,212,255,.22),transparent 70%),linear-gradient(rgba(0,212,255,.045) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(0,212,255,.045) 1px,transparent 1px) 0 0/34px 34px,#02060C;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(transparent 0 2px,rgba(0,212,255,.022) 2px 3px)}
input,select,textarea{font-family:inherit;border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.04)}
h1{font-family:Orbitron,sans-serif;font-size:19px;letter-spacing:.04em;font-weight:700;text-shadow:0 0 14px rgba(0,212,255,.5)}
h2{font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(0,212,255,.5),transparent)}
.sub{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.16em;color:var(--blue);line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:6px;animation:pl 1.6s infinite}
.avatar{border:2px solid var(--blue);box-shadow:0 0 16px rgba(0,212,255,.5)}
.card{border-radius:14px;background:linear-gradient(160deg,rgba(0,212,255,.07),rgba(7,18,28,.88));border:1px solid rgba(0,212,255,.22);box-shadow:inset 0 0 24px rgba(0,212,255,.05),0 0 18px rgba(0,212,255,.05)}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--blue);filter:drop-shadow(0 0 4px var(--blue))}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.card.hero{background:linear-gradient(160deg,rgba(0,212,255,.1),rgba(7,18,28,.9));border-color:rgba(0,212,255,.4);flex-direction:column;gap:14px;padding:18px 14px}
#app .lbl{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.v{font-family:Orbitron,sans-serif;font-size:19px;font-weight:500}
.v small{font-size:11px}
.big{font-family:Orbitron,sans-serif;font-size:26px;font-weight:700;text-shadow:0 0 16px rgba(0,212,255,.7)}
.ico{border-radius:8px;background:rgba(0,212,255,.12)}
.bar{height:5px;background:rgba(0,212,255,.1)}
.bar i,.bt{background:linear-gradient(90deg,#0090B8,#00D4FF);box-shadow:0 0 10px var(--blue)}
.add{background:var(--blue);color:#021018;font-weight:700;box-shadow:0 0 12px rgba(0,212,255,.5)}
.reactor{position:relative;width:216px;height:216px}
.reactor svg{width:100%;height:100%}
.reactor circle.bg{fill:none;stroke:rgba(0,212,255,.1);stroke-width:8}
.reactor circle.fg{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px;transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
.spin{transform-origin:100px 100px;animation:rot 40s linear infinite}
.spin2{transform-origin:100px 100px;animation:rot 22s linear infinite reverse}
.core{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.legend{display:flex;gap:8px;width:100%}
.legend div{flex:1;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.15);border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.legend b{display:block;font-family:Orbitron,sans-serif;font-size:14px;color:var(--text);margin-top:2px}
.brf{margin-bottom:12px}
#brf{font-size:17px;line-height:1.45;margin-top:6px;min-height:54px}
#brf::after{content:"\258D";color:var(--blue);animation:pl 1s steps(1) infinite}
#fab{background:radial-gradient(circle,#BFF6FF 0,#00D4FF 28%,#0A5E7A 72%);color:#02202B;box-shadow:0 0 0 3px rgba(0,212,255,.25),0 0 28px rgba(0,212,255,.8);animation:fp 2.4s ease-in-out infinite}
.mi{background:rgba(4,16,26,.92);border:1px solid rgba(0,212,255,.45);border-radius:12px;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 16px rgba(0,212,255,.18)}
#sheet{background:rgba(4,14,22,.95);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--blue);box-shadow:0 -10px 50px rgba(0,212,255,.15)}
#sheet h3{font-family:Orbitron,sans-serif;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);text-shadow:0 0 12px rgba(0,212,255,.5)}
.btn{background:linear-gradient(90deg,#0090B8,#00D4FF);color:#021018;font-family:Orbitron,sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 18px rgba(0,212,255,.3)}
.btn[style*="background"]{color:var(--text);box-shadow:none;border:1px solid rgba(0,212,255,.25)}
.tab{border:1px solid transparent;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.06em}
.tab.on{background:rgba(0,212,255,.16);color:var(--blue);border-color:var(--blue);box-shadow:0 0 12px rgba(0,212,255,.3)}
.sm b{font-family:Orbitron,sans-serif;font-size:15px}
.sm,.ce{border:1px solid rgba(0,212,255,.12)}
#boot{position:fixed;inset:0;background:#02060C;z-index:200;display:grid;place-items:center;transition:opacity .7s}
.b1{font-family:Orbitron,sans-serif;font-size:22px;letter-spacing:.3em;color:#00D4FF;text-shadow:0 0 18px #00D4FF;margin-top:14px}
.b2{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.2em;color:#6C93A6;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="veil"></div>
<div id="menu"></div>
<button id="fab" aria-label="Menü">+</button>
<div id="sheet"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
var S={name:"Chris",avatar:"",steps:0,distKm:0,stepLen:0.76,stepGoal:10000,foods:[],kcalGoal:2400,water:0,waterGoal:3000,plan:{},hist:[],bodyKg:80,work:[],wage:18,events:[],days:{},trades:[]};
var today=new Date().toDateString();function applyData(sv){if(sv.day&&sv.day!==today){delete sv.foods;delete sv.water;delete sv.steps;delete sv.distKm;S.foods=[];S.water=0;S.steps=0;S.distKm=0}for(var k in sv)S[k]=sv[k]}try{applyData(JSON.parse(localStorage.getItem("lifeos_preview")||"{}"))}catch(e){}
function save(){S.days[iso()]={steps:S.steps,kcal:E(),water:S.water};try{var o={name:S.name,avatar:S.avatar,foods:S.foods,water:S.water,steps:S.steps,distKm:S.distKm,stepLen:S.stepLen,stepGoal:S.stepGoal,plan:S.plan,hist:S.hist,bodyKg:S.bodyKg,work:S.work,wage:S.wage,events:S.events,days:S.days,trades:S.trades,kcalGoal:S.kcalGoal,waterGoal:S.waterGoal,day:today};localStorage.setItem("lifeos_preview",JSON.stringify(o));cloud(o)}catch(e){}}
var EV=[["09:00","Team-Meeting","Arbeit"],["13:30","Zahnarzt","Privat"],["18:00","Oberkörper-Training","Gym"]];
var ITEMS=[["🥗","Ernährung & Wasser"],["🏋️","Gym & Trainingsplan"],["👟","Schritte & Distanz"],["📅","Kalender"],["💼","Arbeit & Verdienst"],["📊","Statistiken"],["⚙️","Profil & Einstellungen"],["📈","Trading & Journal"]];
function greet(){var h=new Date().getHours();return h<11?"Guten Morgen":h<18?"Guten Tag":"Guten Abend"}
function f(n,d){return n.toLocaleString("de-DE",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function pct(a,b){return Math.min(100,Math.round(a/b*100))}
function render(){
var left=Math.max(0,S.kcalGoal-E()),C=2*Math.PI*52,off=C*(1-Math.min(1,E()/S.kcalGoal));
var km=S.distKm>0?S.distKm:S.steps*S.stepLen/1000,earn=W().d*S.wage;
var date=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
function c(i,ico,l,v,u,p,extra,g){return '<div class="card"'+(g!=null?' data-go="'+g+'"':'')+' style="animation-delay:'+(i*70)+'ms"><span class="ico">'+ico+'</span> <span class="lbl">'+l+'</span><div class="v">'+v+' <small>'+u+'</small></div>'+(p!=null?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+(extra||'')+'</div>'}
function rg(r,p,col){var C2=2*Math.PI*r;return '<circle class="bg" cx="100" cy="100" r="'+r+'"/><circle class="fg" cx="100" cy="100" r="'+r+'" stroke="'+col+'" style="filter:drop-shadow(0 0 4px '+col+')" stroke-dasharray="'+C2+'" stroke-dashoffset="'+C2+'" data-off="'+C2*(1-Math.min(1,p||0))+'"/>'}
document.getElementById("app").innerHTML=
'<header><div><div class="sub"><span class="dot"></span>SYSTEME ONLINE · <span id="clk"></span><br>'+date.toUpperCase()+'</div><h1 id="nm">'+greet()+', '+S.name+'</h1></div><div class="avatar" id="av" style="'+(S.avatar?'background-image:url('+S.avatar+')':'')+'">'+(S.avatar?'':S.name.charAt(0).toUpperCase())+'</div></header>'+
'<div class="card hero" data-go="0"><div class="reactor"><svg viewBox="0 0 200 200"><circle class="spin" cx="100" cy="100" r="96" fill="none" stroke="rgba(0,212,255,.5)" stroke-width="1.5" stroke-dasharray="2 8"/><circle class="spin2" cx="100" cy="100" r="46" fill="none" stroke="rgba(0,212,255,.45)" stroke-width="1" stroke-dasharray="14 6"/>'+rg(84,E()/S.kcalGoal,'#00D4FF')+rg(70,S.steps/S.stepGoal,'#2DFFB0')+rg(56,S.water/S.waterGoal,'#4D8DFF')+'</svg><div class="core"><div class="big">'+f(left)+'</div><div class="lbl">kcal \u00fcbrig</div></div></div><div class="legend"><div data-go="0"><i style="background:#00D4FF"></i>Kalorien<b>'+pct(E(),S.kcalGoal)+'%</b></div><div data-go="2"><i style="background:#2DFFB0"></i>Schritte<b>'+pct(S.steps,S.stepGoal)+'%</b></div><div data-go="0"><i style="background:#4D8DFF"></i>Wasser<b>'+pct(S.water,S.waterGoal)+'%</b></div></div></div>'+
'<div class="card brf"><div class="lbl">J.A.R.V.I.S. Briefing</div><div id="brf"></div></div>'+
'<div class="grid">'+
c(1,"👟","Schritte",f(S.steps),"/ "+f(S.stepGoal),pct(S.steps,S.stepGoal),null,2)+
c(2,"📍","Distanz",f(km,1),"km",null,null,2)+
c(3,"💧","Wasser",f(S.water/1000,2),"/ "+f(S.waterGoal/1000,1)+" L",pct(S.water,S.waterGoal),'<button class="add" id="w">+ 250 ml</button>',0)+
c(4,"🔥","Gym verbrannt",f(G().k),"kcal",null,null,1)+
